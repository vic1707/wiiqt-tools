name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
      - name: build ohneschwanzenegger
        run: |
          mkdir build-ohne && cd build-ohne
          qmake ../ohneschwanzenegger/refleurii.pro
          make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: build nandBinCheck
        run: |
          mkdir build-nbc && cd build-nbc
          qmake ../nandBinCheck/nandBinCheck.pro
          make -j"$(getconf _NPROCESSORS_ONLN)"
